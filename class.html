<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maple Wordle - Guess the Class</title>
<script src="move.js?v=1"></script>
<link rel="stylesheet" href="style.css?v=121">
</head>
<body>
<button id="archiveBtn" class="panel">Archive</button>
<div id="archive" hidden>
  <div class="panel">
    <h2>Archive</h2>
    <div id="archiveList"></div>
    <p class="closebar"><button id="archiveClose">Close</button></p>
  </div>
</div>
<div class="panel game">
<h1>Maple Wordle</h1>
<div id="games">
  <button onclick="location.href='./'">Guess the Boss</button>
  <button class="on">Guess the Class</button>
  <button disabled>Guess the Map<small>Coming soon</small></button>
</div>
<div id="subgames">
  <button class="on">Wordle</button>
  <button onclick="location.href='animation'">Attack Animation</button>
</div>
<div class="infostrip" id="infostrip">
  <div><span class="k" id="puzzleLabel">Puzzle</span><span class="v" id="puzzle"></span></div>
  <div><span class="k" id="timerLabel">Next in</span><span class="v" id="timer"></span></div>
  <div><span class="k">Streak</span><span class="v" id="streak"></span></div>
</div>
<p><button id="today" hidden>Back to today</button></p>
<p id="status"></p>
<p><button id="share" hidden>Share</button></p>
<div class="pickrow">
<div id="picker">
  <input id="guess" type="search" placeholder="Type a class name" autocomplete="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-form-type="other">
  <div id="list" hidden></div>
</div>
<button id="infoBtn" title="How to play">?</button>
</div>
<div class="table-wrap">
<table>
  <thead><tr><th>Class</th><th>Faction</th><th>Job Branch</th><th>Main Stat</th><th>Release Year (GMS)</th><th>Region</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<div id="stats" hidden>
  <h3 id="statsTitle"></h3>
  <div id="statsBars"></div>
  <p id="statsAvg"></p>
</div>
</div>
<footer class="panel">
  Want to give any suggestions or feedback?<br>
  <a href="https://discord.gg/f22H4UJ" target="_blank" rel="noopener">Join the Discord!</a>
</footer>
<div id="creditWrap">
  <div id="clip-left" class="peekclip"><img src="images/peek/sato.png" alt=""></div>
  <div id="clip-mid" class="peekclip"><img src="images/peek/elysia.png" alt=""></div>
  <div id="clip-right" class="peekclip"><img src="images/peek/moeko.png" alt=""></div>
  <div id="credit" class="panel">Made by Yuki with Love &lt;3</div>
</div>
<button id="version" class="panel">alpha v4.3.2</button>
<div id="info" hidden>
  <div class="panel">
    <h2>How to play</h2>
    <div id="infoBody"></div>
    <p class="closebar"><button id="infoClose">Close</button></p>
  </div>
</div>
<div id="changelog" hidden>
  <div class="panel">
    <h2>Changelog</h2>
    <div id="changelogBody"></div>
    <p class="closebar"><button id="changelogClose">Close</button></p>
  </div>
</div>
<script src="fx.js?v=99"></script>
<script src="archive.js?v=6"></script>
<script src="class.js?v=29"></script>
</body>
</html>
