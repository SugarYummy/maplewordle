<!doctype html>
<html data-shell>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapledle</title>
<script src="move.js?v=4"></script>
<script>{const c=document.documentElement.classList;c.add('fps30');try{c.toggle('dark',localStorage.getItem('mapleWordle:dark')==='1');c.toggle('fps30',localStorage.getItem('mapleWordle:fps')!=='60')}catch{}}</script>
<link rel="stylesheet" href="style.css?v=283">
<style>
  /* The background (style.css's picture, or your theme from fx.js) is drawn here, under the game's frame. */
  html, body { height: 100%; min-height: 0; overflow: hidden; }
  /* Phones that draw the page under the gesture bar (newer Android Chrome) or the home indicator (iPhone): the background
     reaches the screen's edges (viewport-fit=cover above), the game stays clear of them. The colour shows only if a
     browser still leaves a strip: the bottom edge of the default picture. */
  html { background: #57856a; }
  #game { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);   /* (a frame needs its size spelled out) */
          width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
          height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
          border: 0; display: block; background: transparent; }
</style>
</head>
<body>
<iframe id="game" title="Mapledle" allow="autoplay; fullscreen; clipboard-write"></iframe>
<script src="shell.js?v=3"></script>
</body>
</html>
