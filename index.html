<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maple Wordle</title>
<style>
  body { text-align: center; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         background: #3b8fe0 url("images/background.webp") center bottom / cover no-repeat fixed; }
  .panel { background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           border-radius: 12px; padding: 8px 16px 16px; margin: 16px; max-width: calc(100% - 64px); }
  .table-wrap { overflow-x: auto; }
  footer.panel { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 1; margin: 0;
                 padding: 6px 16px; border-radius: 12px 12px 0 0; font-size: 14px; white-space: nowrap; }
  .game { position: relative; z-index: 2; margin-bottom: 80px; }
  #version { position: fixed; bottom: 8px; left: 10px; z-index: 1; margin: 0; padding: 4px 10px; font-size: 12px;
             border: none; cursor: pointer; font-family: inherit; }
  #archiveBtn { position: fixed; top: 12px; left: 12px; z-index: 3; margin: 0; padding: 6px 12px; font-size: 14px;
                border: none; cursor: pointer; font-family: inherit; }
  /* Credit box with characters peeking out from behind it. */
  #creditWrap { position: fixed; bottom: 8px; right: 10px; z-index: 1; }
  #credit { position: relative; z-index: 5; margin: 0; padding: 4px 10px; font-size: 12px; cursor: pointer;
            white-space: nowrap; max-width: none; user-select: none; -webkit-user-select: none;
            background: #d7e9f9; }  /* solid, so peeking characters stay fully hidden behind it */
  /* Each clip is a window the character slides through; its edge sits at the middle of the box,
     so the character looks like it's coming out from behind the box. */
  .peekclip { position: absolute; z-index: 1; overflow: hidden; pointer-events: none; }
  .peekclip img { position: absolute; width: 120px; image-rendering: pixelated; transition: transform 0.35s ease; }
  /* Layering: sato (left) in front of elysia (middle) in front of moeko (right), all behind the box. */
  #clip-left { z-index: 4; }
  #clip-mid { z-index: 3; }
  #clip-right { z-index: 2; }
  #clip-mid, #clip-right { bottom: 12px; width: 120px; height: 110px; }
  #clip-mid { left: calc(40% - 54px); }
  #clip-right { left: calc(78% - 60px); }
  #clip-mid img, #clip-right img { left: 50%; bottom: 0; transform: translate(-50%, 100%); }
  #clip-mid.up img, #clip-right.up img { transform: translate(-50%, 8%); }
  /* The left one isn't cropped at all: she fades in while sliding out from behind the box's left side and tilting. */
  #clip-left { right: calc(100% - 95px); bottom: 0; width: 170px; height: 150px; overflow: visible; }
  #clip-left img { right: 0; bottom: 18px; transform-origin: bottom right; opacity: 0;
                   transform: translateX(35%) rotate(0deg); transition: transform 0.35s ease, opacity 0.25s ease; }
  #clip-left.up img { opacity: 1; transform: translateX(-8%) rotate(-20deg); }
  #archive, #changelog { position: fixed; inset: 0; z-index: 4; background: rgba(0, 0, 0, 0.4); display: flex;
             align-items: flex-start; justify-content: center; }
  #archive[hidden], #changelog[hidden] { display: none; }
  #changelogBody { text-align: left; max-width: 420px; }
  #changelogBody h3 { margin: 12px 0 4px; }
  /* Close button stays visible at the bottom while the window scrolls. */
  .closebar { position: sticky; bottom: -16px; margin: 0 -16px -16px; padding: 10px 0 14px;
              background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #changelogBody .date { font-size: 13px; font-weight: normal; margin-left: 8px; opacity: 0.75; }
  #changelogBody ul { margin: 0; padding-left: 20px; }
  #archive .panel, #changelog .panel { margin-top: 48px; max-height: calc(100vh - 96px); overflow-y: auto; min-width: 280px; }
  #archiveTabs { margin-bottom: 8px; }
  #archiveList button { display: block; width: 100%; margin: 4px 0; padding: 6px; text-align: left;
                        background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 6px; cursor: pointer; }
  #archiveList button:hover { background: rgba(255, 255, 255, 0.65); }
  th { background: rgba(255, 255, 255, 0.6); }
  td, th { border: 1px solid #999; padding: 4px 8px; }
  table { border-collapse: collapse; margin: 8px auto; }
  .green { background: #6c6; }
  .yellow { background: #ec5; }
  .red { background: #e66; }
  .answer td { background: #9cf; font-weight: bold; }
  #stats { max-width: 420px; margin: 12px auto 0; }
  .statrow { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .statrow .label { width: 44px; text-align: right; }
  .statrow .track { flex: 1; background: rgba(0, 0, 0, 0.12); border-radius: 4px; height: 18px; overflow: hidden; }
  .statrow .bar { display: block; height: 100%; background: #888; }
  .statrow.mine .bar { background: #3a3; }
  .statrow.mine .label { font-weight: bold; }
  #statsAvg { white-space: pre-line; }
  .statrow .pct { width: 40px; text-align: left; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 90px; }
  .card img, .card .noimg { width: 56px; height: 56px; object-fit: contain; border-radius: 8px; }
  .card .noimg { display: flex; align-items: center; justify-content: center; background: #555; color: #fff; font-size: 28px; }
  #modes .on, #archiveTabs .on { font-weight: bold; outline: 2px solid #333; }
  #picker { position: relative; display: inline-block; }
  #list { position: absolute; top: 100%; left: 0; right: 0; max-height: 240px; overflow-y: auto;
          background: #fff; border: 1px solid #999; text-align: left; z-index: 1; }
  #list div { padding: 4px 6px; cursor: pointer; }
  #list div:hover, #list .active { background: #ddd; }
  /* Phones: keep the corner boxes clear of the Discord box and the game panel. */
  @media (max-width: 700px) {
    #version, #creditWrap { bottom: 64px; }
    .game { margin-top: 56px; }
  }
</style>
</head>
<body>
<button id="archiveBtn" class="panel">Archive</button>
<div id="archive" hidden>
  <div class="panel">
    <h2>Archive</h2>
    <div id="archiveTabs">
      <button data-mode="story">Story</button>
      <button data-mode="normal">Normal</button>
      <button data-mode="hard">Hard</button>
      <button data-mode="extreme">Extreme</button>
    </div>
    <div id="archiveList"></div>
    <p class="closebar"><button id="archiveClose">Close</button></p>
  </div>
</div>
<div class="panel game">
<h1>Maple Wordle</h1>
<p id="puzzle"></p>
<p><button id="today" hidden>Back to today</button></p>
<div id="modes">Mode:
  <button data-mode="story">Story</button>
  <button data-mode="normal" class="on">Normal</button>
  <button data-mode="hard">Hard</button>
  <button data-mode="extreme">Extreme</button>
</div>
<p id="timer"></p>
<p id="status"></p>
<p><button id="share" hidden>Share</button></p>
<div id="picker">
  <input id="guess" placeholder="Type a boss" autocomplete="off">
  <div id="list" hidden></div>
</div>
<button id="go">Guess</button>
<div class="table-wrap">
<table>
  <thead><tr><th>Boss</th><th>World</th><th>Gender</th><th>Region</th><th>Phases</th><th>HP</th><th>Entry Lv</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<div id="stats" hidden>
  <h3 id="statsTitle"></h3>
  <div id="statsBars"></div>
  <p id="statsAvg"></p>
</div>
</div>
<footer class="panel">
  Want to give any suggestions or feedback?<br>
  <a href="https://discord.gg/f22H4UJ" target="_blank" rel="noopener">Join the Discord!</a>
</footer>
<div id="creditWrap">
  <div id="clip-left" class="peekclip"><img src="images/peek/sato.png" alt=""></div>
  <div id="clip-mid" class="peekclip"><img src="images/peek/elysia.png" alt=""></div>
  <div id="clip-right" class="peekclip"><img src="images/peek/moeko.png" alt=""></div>
  <div id="credit" class="panel">Made by Yuki with Love &lt;3</div>
</div>
<button id="version" class="panel">alpha v1.1</button>
<div id="changelog" hidden>
  <div class="panel">
    <h2>Changelog</h2>
    <div id="changelogBody"></div>
    <p class="closebar"><button id="changelogClose">Close</button></p>
  </div>
</div>
<script src="script.js?v=22"></script>
</body>
</html>
